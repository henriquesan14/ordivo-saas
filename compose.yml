name: ordivo

services:
  web:
    build:
      context: ./frontend/ordivo-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordivo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordivo_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ordivo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ordivo-local-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__OrdivoDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ordivo};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-ordivo_dev_password}
      Database__ApplyMigrations: "true"
      Jwt__Issuer: ${JWT_ISSUER:-Ordivo}
      Jwt__Audience: ${JWT_AUDIENCE:-Ordivo.Web}
      Jwt__Key: ${JWT_KEY:-development-only-docker-key-change-before-production-2026}
      Jwt__AccessTokenExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      RefreshToken__ExpirationDays: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}
      DataProtection__KeysPath: /keys
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:-}
      Payments__ApiBaseUrl: ${PAYMENTS_API_BASE_URL:-}
      Payments__ApiKey: ${PAYMENTS_API_KEY:-}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@ordivo.local}
      Email__FromName: ${SMTP_FROM_NAME:-Ordivo}
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      AuthCookie__Secure: "false"
      S3__ServiceUrl: http://minio:9000
      S3__Region: ${S3_REGION:-us-east-1}
      S3__Bucket: ${S3_BUCKET:-ordivo-attachments}
      S3__AccessKey: ${S3_ACCESS_KEY:-ordivo}
      S3__SecretKey: ${S3_SECRET_KEY:-ordivo-local-secret}
      S3__ForcePathStyle: "true"
      PlatformAdmin__Name: ${PLATFORM_ADMIN_NAME:-Platform Admin}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:-admin@ordivo.local}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:-ChangeThisPlatformAdminPassword!2026}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - data-protection-keys:/keys

volumes:
  postgres-data:
  data-protection-keys:
  minio-data:
