name: ordivo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordivo}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__OrdivoDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ordivo};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-}
      Database__ApplyMigrations: "true"
      Jwt__Issuer: ${JWT_ISSUER:-Ordivo}
      Jwt__Audience: ${JWT_AUDIENCE:-Ordivo.Web}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__AccessTokenExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      RefreshToken__ExpirationDays: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}
      DataProtection__KeysPath: /keys
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@ordivo.local}
      Email__FromName: ${SMTP_FROM_NAME:-Ordivo}
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      AuthCookie__Secure: "false"
      PlatformAdmin__Name: ${PLATFORM_ADMIN_NAME:-Platform Admin}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:-admin@ordivo.local}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - data-protection-keys:/keys

volumes:
  postgres-data:
  data-protection-keys:
